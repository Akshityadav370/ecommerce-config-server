spring:
  application:
    name: api-gateway

server:
  port: 8080

# JWT (sensitive! In production, use encrypted values or Vault)
jwt:
  secretKey: asdfkasdf89as7dfasd9fyuakjshdfa87sdf8iasuhfjas9d8f7as8idfuhjasd89f7asdi8fu

# API Gateway routes
spring:
  cloud:
    gateway:
      routes:
        - id: shipping-service
          uri: lb://SHIPPING-SERVICE
          predicates:
            - Path=/api/v1/shipping/**
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: LoggingOrdersFilter
            - name: Authentication
        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/v1/**
          filters:
            - AddRequestHeader=X-Custom-Header, Anuj
            - name: Authentication

